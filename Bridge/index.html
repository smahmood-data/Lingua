<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Lingua is a live interpreter for high-stakes conversations, translating between English and Urdu in real time."
    />
    <meta
      name="theme-color"
      content="#f5f4ef"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121614"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Applied before first paint; useTheme adopts the result.
      try {
        var saved = localStorage.getItem('lingua-theme')
        document.documentElement.dataset.theme =
          saved === 'light' || saved === 'dark'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <title>Lingua — Live Interpreter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
