<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bridge Template</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --primary: #2563eb;
        --border: #e5e7eb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .container {
        max-width: 1100px;
        margin: 60px auto;
        padding: 24px;
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        padding: 32px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 5vw, 3rem);
      }

      p {
        margin: 0 0 24px;
        color: var(--muted);
        line-height: 1.6;
      }

      .button {
        display: inline-block;
        background: var(--primary);
        color: #fff;
        text-decoration: none;
        padding: 12px 20px;
        border-radius: 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="card">
        <h1>Hello World</h1>
        <p>
          This is a simple HTML template with a clean layout, responsive styling,
          and a modern card design.
        </p>
        <a href="#" class="button">Get Started</a>
      </section>
    </main>
  </body>
</html>
